<!-- Empty State (shows when no folders exist) -->
<div *ngIf="!AllFile.HasFile" class="empty-folder-state text-center p-5 my-4 rounded-3">
    <div class="empty-icon-wrapper mx-auto mb-3 d-flex align-items-center justify-content-center rounded-circle">
        <i class="bi bi-folder2-open fs-1 text-muted"></i>
    </div>
    <h5 class="text-light fw-semibold mb-1">No Files Found</h5>
    <p class="text-secondary fs-7 mb-0">There are no files to display in this location right now.</p>
</div>

<!-- File List -->
<h5 *ngIf="AllFile.HasFile" class="text-muted my-3 section_header">Files</h5>

<div *ngIf="AllFile.HasFile" class="row row-cols-1 row-cols-sm-2 row-cols-md-2 row-cols-lg-4 g-3">

    <div class="col" *ngFor="let file of AllFile.FilesList">
        <app-file-card [FileInfo]="file"></app-file-card>
    </div>
</div>
