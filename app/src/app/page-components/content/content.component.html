<div class="container p-3">
    <div class="d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center">
            <h3 *ngFor="let folder of FullFolderPath"><span (click)="NavigateToFolder(folder)"
                    class="cursor_pointer">{{folder.FolderName}}</span>&nbsp;/&nbsp;</h3>
        </div>

        <button class="btn btn-primary btn-sm d-flex align-items-center" (click)="CreateFolder()">
            <i class="bi bi-folder fs-5 me-2"></i> Create
        </button>
    </div>

    <div>
        <div *ngFor="let folder of AllFolder.FoldersList">
            <span (click)="NavigateToFolder(folder)" class="cursor_pointer">{{folder.FolderName}}</span>
        </div>
    </div>
</div>
