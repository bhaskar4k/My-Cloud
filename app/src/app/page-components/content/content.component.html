<div class="container-fluid py-3">

    <!-- Header -->
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">

        <!-- Breadcrumb -->
        <nav aria-label="breadcrumb" class="overflow-auto">
            <ol class="breadcrumb mb-0 flex-nowrap">
                <li class="breadcrumb-item cursor_pointer" *ngFor="let folder of FullFolderPath; let last = last"
                    [class.active]="last" [attr.aria-current]="last ? 'page' : null">

                    <ng-container *ngIf="!last; else currentFolder">
                        <a class="text-decoration-none text-primary" role="button" (click)="NavigateToFolder(folder)">
                            {{ folder.FolderName }}
                        </a>
                    </ng-container>

                    <ng-template #currentFolder>
                        {{ folder.FolderName }}
                    </ng-template>

                </li>
            </ol>
        </nav>


        <div class="d-flex align-items-center">
            <!-- Create Button -->
            <button class="btn btn-primary d-flex align-items-center align-self-start align-self-md-center me-2"
                (click)="CreateFolder()">
                <i class="bi bi-folder-plus me-2"></i>
                Create
            </button>

            <!-- Upload Button -->
            <button class="btn btn-secondary d-flex align-items-center align-self-start align-self-md-center"
                (click)="UploadFile()">
                <i class="bi bi-upload me-2"></i>
                Upload
            </button>
        </div>

    </div>

    <hr>


    <!-- Empty State (shows when no folders exist) -->
    <div *ngIf="!AllFolder.HasFolder" class="empty-folder-state text-center p-5 my-4 rounded-3">
        <div class="empty-icon-wrapper mx-auto mb-3 d-flex align-items-center justify-content-center rounded-circle">
            <i class="bi bi-folder2-open fs-1 text-muted"></i>
        </div>
        <h5 class="text-light fw-semibold mb-1">No Folders Found</h5>
        <p class="text-secondary fs-7 mb-0">There are no folders to display in this location right now.</p>
    </div>

    <!-- Folder List -->
    <h5 *ngIf="AllFolder.HasFolder" class="text-muted my-3 section_header">Folders</h5>

    <div *ngIf="AllFolder.HasFolder" class="row row-cols-1 row-cols-sm-2 row-cols-md-2 row-cols-lg-4 g-3">

        <div class="col" *ngFor="let folder of AllFolder.FoldersList">

            <div class="card h-100 border-0 shadow-sm dark-folder-card position-relative overflow-hidden cursor-pointer"
                (click)="NavigateToFolder(folder)">

                <!-- Amber edge highlight bar on hover -->
                <div class="folder-card-accent"></div>

                <div class="card-body d-flex align-items-center p-3">
                    <!-- Glowing dark icon badge -->
                    <div class="icon-wrapper me-3 d-flex align-items-center justify-content-center rounded-3 p-2">
                        <i class="bi bi-folder-fill fs-3 text-warning"></i>
                    </div>

                    <!-- Text content -->
                    <div class="text-truncate flex-grow-1">
                        <h6 class="m-0 text-truncate fw-semibold text-light folder-name">
                            {{ folder.FolderName }}
                        </h6>

                        <small class="text-muted">{{folder.CreatedAt}}</small>
                    </div>

                    <!-- Hover chevron indicator -->
                    <i class="bi bi-three-dots-vertical ms-2 fs-6 folder_view_more"
                        (click)="ViewMoreInFolder(folder)"></i>
                </div>
            </div>

        </div>
    </div>

</div>
