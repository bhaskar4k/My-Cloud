<div class="p-4">
    <div class="card shadow-lg">

        <div class="card-body p-4 p-lg-4">

            <h2 class="text-center mb-4">
                Create Folder
            </h2>

            <div class="alert alert-info mb-4">
                <h5 class="alert-heading">
                    Before you create
                </h5>

                <ul class="mb-0">
                    <li>Choose a meaningful and descriptive folder name.</li>
                    <li>Folder names must be unique within the current location.</li>
                    <li>You can rename the folder later if needed.</li>
                </ul>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">
                    Folder Name
                </label>

                <input type="text" class="form-control input_border" [(ngModel)]="folderName"
                    placeholder="Enter folder name">
            </div>

        </div>

        <div class="d-flex justify-content-end gap-2 px-4 pb-4">
            <button class="btn btn-secondary" (click)="close()">
                Close
            </button>

            <button class="btn btn-primary" [disabled]="isSaveDisabled()" (click)="save()">
                Create Folder
            </button>
        </div>

    </div>
</div>
