<div class="p-3 form_background border rounded">

    <h5 class="mb-3">Create New Folder</h5>

    <input type="text" class="form-control input_border mb-5 mt-4" [(ngModel)]="folderName"
        placeholder="Enter folder name">

    <div class="d-flex justify-content-end gap-2 mt-3">
        <button class="btn btn-secondary" (click)="close()">Close</button>
        <button class="btn btn-primary" [disabled]="isSaveDisabled()" (click)="save()">Save</button>
    </div>

</div>
